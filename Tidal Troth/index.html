["shenhao", "fanxiaoman", "linheng", "luxingzhou"]}, {"k": "2026-03-05", "era": "now", "d": "大雾那天", "t": "龙门吊", "s": "四十米高的驾驶室里，父子把话说开。林衡给严总发了一条消息。", "ch": 14, "who": ["linheng", "linjianguo"]}, {"k": "2026-03-06", "era": "now", "d": "第三天", "t": "存折", "s": "日记封皮里揭出秀英的存折，最后一行：阿根归，止。", "ch": 15, "who": ["fanxiaoman", "linheng"]}, {"k": "2026-03-08", "era": "now", "d": "又过两天", "t": "后人", "s": "沈浩认出存折上的户名。书不拆了，那块布不卖。", "ch": 17, "who": ["shenhao", "linheng", "fanxiaoman", "luxingzhou"]}, {"k": "2026-03-16", "era": "now", "d": "礼拜一 六点半", "t": "越级", "s": "码头上的十分钟。整批收购通过；外派一年改成三年。", "ch": 18, "who": ["linheng", "yanzong", "wangbuzhang"]}, {"k": "2026-04-04", "era": "now", "d": "清明前一天", "t": "江北老码头", "s": "吵了一架。她说不去上海了。那边的海，你帮我看看，是不是这个颜色。", "ch": 19, "who": ["linheng", "fanxiaoman", "fanmu"]}, {"k": "2026-04-05", "era": "now", "d": "清明", "t": "起飞", "s": "林衡飞往马六甲。同一时刻，范小满揭开日记的下一页。", "ch": 19, "who": ["linheng", "fanxiaoman"]}, {"k": "2026-06", "era": "now", "d": "六月", "t": "日记最后一页", "s": "马六甲那边回了四个字：船头朝里。", "ch": 20, "who": ["fanxiaoman", "linheng"]}, {"k": "2026-10", "era": "now", "d": "十月", "t": "文化馆开馆", "s": "日记、存折和修堤账并排展出。林建国的名字印在冷箱那块展板上。", "ch": 20, "who": ["linjianguo", "shenhao", "fanxiaoman"]}, {"k": "2027-04-03", "era": "now", "d": "第二年 四月三号", "t": "我在你家门口", "s": "她飞去马六甲，他回了明州。两条消息前后差了不到一分钟。", "ch": 20, "who": ["fanxiaoman", "linheng", "linmu"]}, {"k": "2027-04-07", "era": "now", "d": "四月七号", "t": "林衡归，止", "s": "机场，一本存折，一年的工资，最后一行是他自己的笔迹。", "ch": 20, "who": ["linheng", "fanxiaoman"]}]}, "chapters": [], "split": {"count": 20, "era": {"5": "民国二十六年", "11": "民国二十七年", "16": "民国三十一年"}, "coda": 20, "italic": "echo", "sign": ["阿根　", "儿立诚叩禀"], "specials": {"沈阿根殁。汇款止。": "zhang zhu", "户房书吏沈默，照册誊录。": "zhang", "民国二十七年十二月。": "zhang", "内补上年十一月份。": "zhang", "上海，公顺典。民国二十七年，腊月初三。破旧呢大衣一件，虫蛀，光板。当洋拾贰元。限期十八个月。": "zhang", "民国二十六年四月，收汇，沈阿根，叁元。": "zhang", "五月，收汇，叁元。六月，收汇，叁元。": "zhang", "周秀英。": "zhang", "沈阿根　星洲　汇明州江北　交周秀英　国币叁元": "zhang", "腊月初五，汇明州，贰拾元。": "zhang", "阿根归，止。": "hand big", "林衡归，止。": "hand big", "布收到了，没舍得做，等你回来再做。": "hand", "上海冷，多穿衣裳。": "hand", "姐，莫慌，有我。": "hand", "严总您好，我是财务部林衡。关于文化馆那批书，能不能给我十分钟。": "msg l", "明天走。": "msg l", "在修复室吗？": "msg l", "我下午过来一趟。": "msg l", "今天的海，比那块布深一点。": "msg l", "今天下雨，海是灰的，不算。": "msg l", "今天的海，跟那块布差不多。可能是我记错了。": "msg l", "今天港池里进来一条船，船身漆成蓝的，比那块布浅。": "msg l", "今天又去了鸡场街的布店。没有。": "msg l", "我在你家门口。": "msg l", "九点，江北老码头。": "msg r", "我在你港口门口。": "msg r", "颜色对的。": "msg r", "\"差一点好。\"": "msg r", "民国二十四年，法币改革。": "search", "这批书单拿出任何一册，都不是最好的。它们最值钱的地方，是还在一起。": "memo"}, "marks": [["范小满", "fanxiaoman"], ["林建国", "linjianguo"], ["金老师", "jinlaoshi"], ["陆行舟", "luxingzhou"], ["董主任", "dongzhuren"], ["汪部长", "wangbuzhang"], ["老先生", "laoxiansheng"], ["沈阿根", "agen"], ["周秀英", "xiuying"], ["程绣芸", "chengxiuyun"], ["林衡", "linheng"], ["林母", "linmu"], ["范母", "fanmu"], ["小舒", "xiaoshu"], ["严总", "yanzong"], ["沈浩", "shenhao"], ["阿根", "agen"], ["秀英", "xiuying"], ["阿宝", "abao"]], "recaps": {"2": "台风夜，林衡路过一座老宅，帮一水阁的修复师范小满抢救泡水的古书。她问港口有没有冷库，他说私调冷箱是违规的，只给了她工会应急群的电话。同一时刻，港区龙门吊上的林建国在群里看见了求助，打开了一只“待检修”的冷箱。老先生在电话里交代：樟木箱里的，务必先救。", "3": "一水阁的文章阅读量过了十万，港口集团要把它报成好人好事，冷箱的审批却谁也拿不出来。补手续的活落到林衡头上。他从配图里那张“安全第一，老婆第二”的贴纸认出，开箱子的是自己的父亲。他去一水阁求范小满帮忙，开口第一句是：林师傅是我爸。", "4": "范小满不肯倒签那天晚上的求助函。金老师用一页嘉靖年间的修堤账讲了三种补法：补在暗处是骗人，破了就扔是糟蹋，第三种是补在明处。两人决定写一份港口和一水阁的应急合作方案。临走时，嘉禾拍卖的陆行舟告诉林衡：港口集团想从这批书里挑几十册，建一个文化馆。", "5": "范小满揭开了樟木箱里日记的第一页：阿根写给秀英，船过马六甲，明年清明一定回来。林衡瞒着文化馆的事，跟她一起写方案。汇报会上方案通过了，严总却当场点名让林衡牵头文化馆收书。范小满问：你知道？他说：我知道。", "6": "民国二十六年正月十八，潮江起雾。阿根挑着铺盖上了船，秀英把一个绣着小船的荷包塞进他手里，船头朝里。秀英的弟弟阿宝在钱庄当伙计，在跳板边上塞给阿根两块钱：家里你放心，有我。", "7": "冷战两周后，范小满拎着一袋生煎找到林衡家，看见一整墙的民国账本。阿根的日记在民国二十六年秋天断了，她查不下去。林衡说：人会不写信，钱不会不寄，钱庄的账上一定有他。他还翻出自己书架上一本汇款簿：一个姓周的钱庄伙计，民国二十七年腊月忽然往家里寄了二十块。", "8": "在市档案馆，林衡从恒裕钱庄的残账里找到了沈阿根：每月三元，汇往明州江北，交周秀英。打着仗，绕道香港，四年没断。他书架上那本汇款簿，寄的也是同一个地址。翻到民国三十一年，账上出现一行朱笔：沈阿根殁，汇款止。", "9": "一水阁手工修复的经费砍了一半，金老师明年退休，修复室只留一个编制。陆行舟请范小满去上海的嘉禾修复中心，也说了想追她。林衡照小舒的“高情商”教程夸她：你就像民国二十四年的法币改革。半夜一点，她还在搜法币改革是什么。", "10": "林衡写的估值报告把日记、账簿列为核心藏品，被战略部红笔退回，他第一次对领导说了“不”。安全科开始翻台风那晚的冷箱。饭桌上父子吵翻，林建国说：那年你已经替我让过一回了。陆行舟把这一切告诉了范小满。那天夜里，她站在港口集团楼下，十七楼的灯一直亮着。", "11": "范小满替林衡修那本汇款簿。两人回档案馆，用侧光照出霉斑下的字：民国二十七年十一月，阿根的钱没到，三个月后才补上。就在那个月，阿宝往家里汇了二十元。汇款簿的封皮里，揭出一张当票：腊月初三，破旧呢大衣一件，当洋拾贰元。", "12": "民国二十七年冬，上海。十一月的南洋汇款压在香港，姐姐多花两角钱，请人写了一封“一切如常”。阿宝知道她宁可借钱也不会动那本存着阿根钱的折子。他向掌柜预支了八块，又当掉了那件呢大衣，凑够二十元。汇单的附言只有五个字：姐，莫慌，有我。", "13": "林母请范小满初三来家里吃饭，好让冷战的父子坐到一张桌上。范小满把父子俩互相夹不出去的鱼肚和蟹钳各自放了回去。洗碗时，林母讲了一件旧事：林衡考上过研究生，读民国的钱和账，因为父亲摔伤了腰，他把通知书收进了抽屉。大年初五，老先生走了。", "14": "老先生的儿子沈浩说书是遗产，要拿回去还债。三百一十二件书被拉去嘉禾，准备拆成三十几个标的上春拍。陆行舟说有个买家愿意整批收下杂件，条件是范小满去上海修。林衡答应外派马六甲一年。范小满对陆行舟说：给我三天。", "15": "大雾停工的早上，林衡爬上父亲的龙门吊。林建国讲了台风那晚开箱子的原因，讲了那张通知书：这回替你自己想一回，我那两年，我自己扛。下了梯子，林衡给分管的严总发了一条消息：能不能给我十分钟。", "16": "范小满答应去嘉禾，在日记的封皮夹层里揭出秀英的存折。总账上写着阿根殁，存折上却从民国三十一年三月起每月还有一笔，写的是“收现”：有人自己走到柜台上存进去的。最后一页，一行歪歪扭扭的字：阿根归，止。林衡这才知道，她为了这几页纸已经答应去上海了。", "17": "民国三十一年三月，恒裕的伙计冒雨来报信：阿根的船沉了。秀英说：晓得了，你进来擦擦头发。第二天，她过江，把卖绣活的钱推上柜台：照旧，记在他名下。那天夜里，她在那块蓝花布的一角，绣下了第一道潮水。", "18": "林衡请陆行舟放手，让范小满自己选。沈浩认出存折上的户名是他奶奶，爷爷就是阿根。布上的潮水和存折上的“收现”，都是七十三。沈浩决定不拆了，整批卖，那块布不卖。陆行舟用自己的名字重估了整批藏品，也承认那个买家就是他。战略部却回话：预算只够四十七册。", "19": "礼拜一早上六点半，林衡在码头上拦住严总，把整批收购、捐给一水阁、冷箱违规写进展览的方案讲完。办公会通过了，林建国被通报批评。代价是林衡越过了两级，外派从一年改成三年。范小满是从小舒嘴里听到“三年”的。", "20": "清明前一天，范母约林衡去湖边喝茶，问了三个问题。夜里，两人在江北老码头吵了一架：你倒是一样都不欠，你连让我还的机会都不给。她说不去上海了；他说到“明年清明”，没有说下去。她说：那边的海，你帮我看看，是不是这个颜色。第二天，他飞往马六甲。"}}}</script>
